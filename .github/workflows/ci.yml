name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Version tag to validate before building
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-format-18
      - name: Check C++ formatting
        run: git ls-files -z -- '*.cpp' '*.hpp' | xargs -0 clang-format-18 --dry-run --Werror

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MIZUKI_RELEASE_TAG: ${{ inputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DMIZUKI_BUILD_DISTRIBUTION=ON
          -DMIZUKI_RELEASE_TAG="$MIZUKI_RELEASE_TAG"
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      - name: Upload verified release packages
        uses: actions/upload-artifact@v4
        with:
          name: mizuki-${{ runner.os }}-x86_64
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ci/packages/*.tar.gz
            build/ci/packages/*.zip
            build/ci/packages/*.sha256
