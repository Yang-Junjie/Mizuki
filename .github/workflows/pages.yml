name: Deploy documentation to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Configure Mizuki
        run: >-
          cmake -S . -B build/pages -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          -DFETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER
      - name: Build Mizuki
        run: cmake --build build/pages --target mizuki --parallel 2
      - name: Check documentation
        run: python3 tests/test_docs.py build/pages/bin/mizuki
      - name: Build documentation with Mizuki
        env:
          MIZUKI_PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: >-
          ./build/pages/bin/mizuki build --config docs/mizuki.toml
          --base-url "$MIZUKI_PAGES_BASE_URL"
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
