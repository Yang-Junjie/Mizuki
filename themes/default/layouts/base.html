<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description }}">
  <meta name="author" content="{{ site.author }}">
  <title>{{ page.title }}{% if page.kind != "home" %} · {{ site.title }}{% endif %}</title>
{% if page.canonical_url != "" %}  <link rel="canonical" href="{{ page.canonical_url }}">
{% endif %}{% if feed_url != "" %}  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ feed_url }}">
{% endif %}  <link rel="stylesheet" href="{{ asset_base }}css/style.css">
  {% block head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
{% include "partials/footer.html" %}
</body>
</html>
