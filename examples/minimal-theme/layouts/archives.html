{% extends "base.html" %}
{% block content %}
    <h1>{{ page.title }}</h1>
{% if length(archives) == 0 %}    <p>暂无文章。</p>
{% endif %}{% for group in archives %}    <section>
      <h2>{{ group.year }}</h2>
      <ul>
{% for post in group.posts %}        <li><a href="{{ post.url }}">{{ post.title }}</a> <time datetime="{{ post.date }}">{{ post.date }}</time></li>
{% endfor %}      </ul>
    </section>
{% endfor %}{% endblock %}
