# CLI 参数优先于此文件；下面的相对路径以此文件所在目录为基准。
title = "Mizuki"
description = "一个用 C++ 编写的轻量博客框架"
author = ""
language = "zh-CN"
# 发布到子目录时设为 "/blog/"；使用 "https://example.com/blog/" 同时启用 RSS、sitemap 与 canonical。
base_url = "/"
content = "content"
theme = "themes/default"
output = "dist"
# 设为 0 可关闭分页；归档按年份列出全部已发布文章。
paginate_by = 10
archives = true

