{% extends "base.html" %}
{% block content %}
      <header class="document-header">
        <p class="eyebrow">MIZUKI / GUIDE</p>
        <h1 id="document-title">{{ page.title }}</h1>
        <p class="lead">{{ page.description }}</p>
      </header>
      <div class="document-grid">
        {% include "partials/toc.html" %}
        <article class="document" aria-labelledby="document-title">
          <div class="prose">{{ html(page.content) }}</div>
        </article>
      </div>
{% endblock %}
